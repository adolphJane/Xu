name: Build Flutter previews

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package macOS preview
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter
        with:
          scaffold-token: ${{ secrets.IFA_FLUTTER_SCAFFOLD_TOKEN }}

      - name: Build universal DMG
        env:
          RELEASE_VERSION: preview-${{ github.sha }}
        run: zsh scripts/package-unsigned.sh --no-pub

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Xu-preview-${{ github.sha }}
          path: dist/Xu-preview-${{ github.sha }}.dmg
          if-no-files-found: error
          retention-days: 14

  mobile:
    uses: ./.github/workflows/mobile.yml
    secrets:
      scaffold_token: ${{ secrets.IFA_FLUTTER_SCAFFOLD_TOKEN }}
