name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build macOS package
    runs-on: macos-15
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' flutter/Packaging/Info.plist)
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "${TAG_VERSION}" != "${APP_VERSION}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match app version ${APP_VERSION}."
            exit 1
          fi

      - uses: ./.github/actions/setup-flutter
        with:
          scaffold-token: ${{ secrets.IFA_FLUTTER_SCAFFOLD_TOKEN }}

      - name: Configure Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_NOTARY_KEY_P8" || -z "$APPLE_NOTARY_KEY_ID" || -z "$APPLE_NOTARY_ISSUER_ID" ]]; then
            echo "::error::Developer ID signing and notarization secrets are required for release."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/xu-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/xu-developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/xu-notary-key.p8"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::No valid Developer ID Application identity was imported."
            exit 1
          fi
          echo "SIGNING_MODE=signed" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_API_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build universal DMG
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('verify-{0}', github.run_id) || github.ref_name }}
        run: zsh scripts/package-macos.sh --no-pub

      - name: Verify Developer ID and notarized DMG
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('verify-{0}', github.run_id) || github.ref_name }}
        run: zsh scripts/verify-developer-id.sh dist/序.app "dist/Xu-${RELEASE_VERSION}.dmg"

      - name: Generate release notes
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG="$(git tag --merged "${GITHUB_SHA}^" --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          {
            echo "## 更新内容"
            echo
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              git log --no-merges --format='- %s (`%h`)' "${PREVIOUS_TAG}..${GITHUB_SHA}"
            else
              git log --no-merges --reverse --format='- %s (`%h`)' --max-count=20 "${GITHUB_SHA}"
            fi
            echo
            echo "## 安装"
            echo
            echo "下载 Xu-${RELEASE_TAG}.dmg，打开 DMG 并将“序”拖到“Applications”快捷入口。"
            echo "此版本已通过 Developer ID 签名和 Apple 公证。"
          } > release-notes.md

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Xu-${GITHUB_REF_NAME}.dmg" \
            --title "序 ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Upload verified DMG
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Xu-verified-${{ github.run_id }}
          path: dist/Xu-verify-${{ github.run_id }}.dmg
          if-no-files-found: error

      - name: Remove temporary signing assets
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/xu-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/xu-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/xu-developer-id.p12" "$RUNNER_TEMP/xu-notary-key.p8"

  mobile:
    uses: ./.github/workflows/mobile.yml
    secrets:
      scaffold_token: ${{ secrets.IFA_FLUTTER_SCAFFOLD_TOKEN }}
