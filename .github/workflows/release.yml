name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build macOS package
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "${TAG_VERSION}" != "${APP_VERSION}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match app version ${APP_VERSION}."
            exit 1
          fi

      - name: Build universal DMG
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: zsh scripts/package-unsigned.sh

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG="$(git tag --merged "${GITHUB_SHA}^" --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          {
            echo "## 更新内容"
            echo
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              git log --no-merges --format='- %s (`%h`)' "${PREVIOUS_TAG}..${GITHUB_SHA}"
            else
              git log --no-merges --reverse --format='- %s (`%h`)' --max-count=20 "${GITHUB_SHA}"
            fi
            echo
            echo "## 安装"
            echo
            echo "下载 序-unsigned-${RELEASE_TAG}.dmg，打开 DMG 并将“序”拖入“应用程序”文件夹。首次打开请参考 DMG 中的安装说明。"
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/序-unsigned-${GITHUB_REF_NAME}.dmg" \
            --title "序 ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
